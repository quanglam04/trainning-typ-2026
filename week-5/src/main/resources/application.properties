spring.mvc.view.prefix=/WEB-INF/view/
spring.mvc.view.suffix=.jsp
#tu dong them tien to .jsp


# Tài khoản demo để thử session và token
app.auth.demo-username=${DEMO_AUTH_USERNAME:demo}
app.auth.demo-password=${DEMO_AUTH_PASSWORD:demo123}
app.auth.jwt-secret-base64=OWiu69aQneTkf/Q3tgRZzAORAStakSAqkhBZ1mxdjC4=

# Kết nối RabbitMQ trong Docker Compose khi Spring Boot chạy trực tiếp trên máy.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:courseshop}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:courseshop_dev_password}

# Hash mới dùng BCrypt (cost factor 12); hash Argon2 cũ được nâng cấp sau lần đăng nhập đúng.
rabbitmq.queue.name = user.registered.email
rabbitmq.exchange.name = courseshop.events
rabbitmq.routing.key =  user.registered

rabbitmq.queue.json.name = queue_json
rabbitmq.routing.json.key = routing_json_key

# SMTP: mặc định chỉ log demo; đặt MAIL_ENABLED=true và cung cấp thông tin SMTP để gửi email thật.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${APP_MAIL_FROM:no-reply@courseshop.local}
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
