server.port=8081
spring.application.name=courseshop

# Redis connection and Spring Cache defaults.
# Spring Boot runs on the host by default; override REDIS_HOST=redis when both run in Compose.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s
spring.cache.type=redis
spring.cache.redis.time-to-live=PT5M
spring.cache.redis.cache-null-values=false

# Đường dẫn kết nối CSDL (thay my_database bằng tên database của bạn)
spring.datasource.url=jdbc:mysql://localhost:3306/course_shop
# Tài khoản và mật khẩu truy cập MySQL
spring.datasource.username=root
spring.datasource.password=Vu23032006@
# Driver kết nối MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Cấu hình Hibernate / JPA (Tự động tạo hoặc cập nhật bảng trong CSDL)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

#config spring security
spring.security.user.name=huyvu
spring.security.user.password=123456

#config view engine
# Source - https://stackoverflow.com/q/64177451
# Posted by GobsRuiz, modified by community. See post 'Timeline' for change history
