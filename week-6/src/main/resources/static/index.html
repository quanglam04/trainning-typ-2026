<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập</title>
  <!-- CSS điều khiển màu sắc, kích thước và bố cục của trang đăng nhập/đăng ký. -->
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; color: #172033; background: #f3f5f9; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    .card { width: min(100%, 410px); padding: 40px; background: #fff; border: 1px solid #e7eaf0; border-radius: 16px; box-shadow: 0 16px 48px rgba(25, 42, 70, .08); }
    h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: -.5px; }
    .intro { margin: 0 0 28px; color: #697386; font-size: 15px; }
    label { display: block; margin: 18px 0 8px; font-size: 14px; font-weight: 600; }
    input { width: 100%; height: 46px; padding: 0 13px; border: 1px solid #d8deea; border-radius: 8px; font: inherit; outline: none; }
    input:focus { border-color: #4568e8; box-shadow: 0 0 0 3px rgba(69, 104, 232, .14); }
    button { width: 100%; height: 46px; margin-top: 24px; border: 0; border-radius: 8px; background: #3458d4; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button:hover { background: #2949bc; }
    button:disabled { opacity: .65; cursor: wait; }
    .switch { margin: 20px 0 0; color: #697386; text-align: center; font-size: 14px; }
    .switch button { width: auto; height: auto; margin: 0; padding: 0; background: none; color: #3458d4; font: inherit; }
    .switch button:hover { background: none; text-decoration: underline; }
    .message { min-height: 20px; margin: 14px 0 0; color: #b42318; font-size: 14px; }
    [hidden] { display: none !important; }
    @media (max-width: 480px) { .card { padding: 30px 24px; } }
  </style>
</head>
<body>
  <!-- Hai màn hình dùng chung một khung; JavaScript bật/tắt bằng thuộc tính hidden. -->
  <main class="card">
    <!-- Form đăng nhập: name của input phải khớp với các trường backend nhận. -->
    <section id="login-view">
      <h1>Đăng nhập</h1>
      <p class="intro">Nhập thông tin tài khoản của bạn để tiếp tục.</p>
      <form id="login-form">
        <label for="login-username">Tên đăng nhập</label>
        <input id="login-username" name="username" autocomplete="username" placeholder="Nhập tên đăng nhập" required>
        <label for="login-password">Mật khẩu</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu" required>
        <button class="submit" type="submit">Đăng nhập</button>
      </form>
      <p class="message" id="login-message" role="status" aria-live="polite"></p>
      <p class="switch">Chưa có tài khoản? <button type="button" data-show="register">Đăng ký</button></p>
    </section>

    <!-- Form đăng ký gửi username, gmail và password đến API tạo tài khoản. -->
    <section id="register-view" hidden>
      <h1>Tạo tài khoản</h1>
      <p class="intro">Điền thông tin để đăng ký tài khoản mới.</p>
      <form id="register-form">
        <label for="register-username">Tên đăng nhập</label>
        <input id="register-username" name="username" autocomplete="username" placeholder="Nhập tên đăng nhập" required>
        <label for="register-email">Email</label>
        <input id="register-email" name="gmail" type="email" autocomplete="email" placeholder="you@example.com" required>
        <label for="register-password">Mật khẩu</label>
        <input id="register-password" name="password" type="password" autocomplete="new-password" minlength="6" placeholder="Ít nhất 6 ký tự" required>
        <button class="submit" type="submit">Đăng ký</button>
      </form>
      <p class="message" id="register-message" role="status" aria-live="polite"></p>
      <p class="switch">Đã có tài khoản? <button type="button" data-show="login">Đăng nhập</button></p>
    </section>
  </main>
  <script>
    // Đường dẫn trang/API home và tên khóa dùng để lưu JWT trong sessionStorage.
    const HOME_URL = '/home';
    const TOKEN_KEY = 'token';

    // Nút "Đăng ký" và "Đăng nhập" chỉ đổi màn hình, không tải lại trang.
    document.querySelectorAll('[data-show]').forEach((button) => {
      button.addEventListener('click', () => {
        const showRegister = button.dataset.show === 'register';
        document.querySelector('#login-view').hidden = showRegister;
        document.querySelector('#register-view').hidden = !showRegister;
        document.title = showRegister ? 'Đăng ký' : 'Đăng nhập';
      });
    });

    // Gửi JSON đến API, đọc body kể cả khi backend trả text hoặc JSON,
    // và biến response lỗi thành thông báo để hiển thị trên form.
    async function postJson(url, payload) {
      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify(payload)
      });
      const raw = await response.text();
      let result = {};
      try { result = raw ? JSON.parse(raw) : {}; } catch { result = { message: raw }; }
      if (!response.ok) throw new Error(result.message || result.error || `Yêu cầu thất bại (${response.status}).`);
      return result;
    }

    // Backend hiện trả SuccessResponse với JWT dạng chuỗi trong trường data.
    // Các nhánh khác giúp frontend cũng nhận được vài cấu trúc token phổ biến.
    function getToken(result) {
      // Current Spring response wraps the JWT as: { code, message, data: "<jwt>" }.
      if (typeof result.data === 'string') return result.data;
      return result.token || result.accessToken || result.data?.token || result.data?.accessToken || result.data?.jwt;
    }

    // Chỉ gọi sau khi đăng nhập thành công: lấy JWT, lưu theo tab hiện tại,
    // rồi điều hướng trình duyệt đến địa chỉ home.
    function finishAuth(result, messageElement) {
      const token = getToken(result);
      if (!token) {
        throw new Error('API thành công nhưng chưa trả JWT. Hãy để backend trả token trong response (token hoặc data.token).');
      }
      sessionStorage.setItem(TOKEN_KEY, token);
      messageElement.style.color = '#14804a';
      messageElement.textContent = 'Thành công. Đang chuyển đến trang chủ…';
      window.location.assign(HOME_URL);
    }

    // Luồng đăng nhập: kiểm tra form, POST credentials, rồi hoàn tất bằng JWT.
    document.querySelector('#login-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      const button = form.querySelector('.submit');
      const message = document.querySelector('#login-message');
      button.disabled = true;
      message.style.color = '#697386';
      message.textContent = 'Đang đăng nhập…';
      try {
        const result = await postJson('/users/login', {
          username: form.elements.username.value.trim(),
          password: form.elements.password.value
        });
        finishAuth(result, message);
      } catch (error) {
        message.style.color = '#b42318';
        message.textContent = error.message || 'Không thể kết nối máy chủ. Vui lòng thử lại.';
      } finally { button.disabled = false; }
    });

    // Luồng đăng ký: tạo tài khoản xong quay về đăng nhập, không tự đăng nhập.
    document.querySelector('#register-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      const button = form.querySelector('.submit');
      const message = document.querySelector('#register-message');
      button.disabled = true;
      message.style.color = '#697386';
      message.textContent = 'Đang tạo tài khoản…';
      try {
        const username = form.elements.username.value.trim();
        await postJson('/users/sign-up', {
          username,
          gmail: form.elements.gmail.value.trim(),
          password: form.elements.password.value
        });
        form.reset();
        document.querySelector('#register-view').hidden = true;
        document.querySelector('#login-view').hidden = false;
        document.title = 'Đăng nhập';
        document.querySelector('#login-username').value = username;
        const loginMessage = document.querySelector('#login-message');
        loginMessage.style.color = '#14804a';
        loginMessage.textContent = 'Đăng ký thành công. Hãy đăng nhập bằng tài khoản vừa tạo.';
      } catch (error) {
        message.style.color = '#b42318';
        message.textContent = error.message || 'Không thể kết nối máy chủ. Vui lòng thử lại.';
      } finally { button.disabled = false; }
    });
  </script>
</body>
</html>
